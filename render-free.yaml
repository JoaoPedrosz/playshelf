# Free academic preview: Flask and a real CouchDB share one ephemeral container.
# Render Free spins down after inactivity, so accounts, orders and stock changes reset.
services:
  - type: web
    name: playshelf-demo
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.demo
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COUCHDB_URL
        value: http://127.0.0.1:5984
      - key: COUCHDB_DATABASE
        value: playshelf
      - key: COUCHDB_USER
        value: playshelf_demo_admin
      - key: COUCHDB_PASSWORD
        generateValue: true
